<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Corridor Grant Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: one-screen app. 48px bar → animated map drawer (44px / 38% / 85%) → two-stage workspace (triage, then 2- or 3-column review). */
:root{
  --bg:#F4F5F2; --surface:#FFFFFF; --sunk:#ECEEE9; --line:#DCDFD8; --line-2:#C9CDC4;
  --ink:#1A211F; --muted:#59635F; --faint:#8A938F;
  --accent:#1F5E58; --accent-soft:#DCEBE8; --on-accent:#FFFFFF;
  --app:#D6602A; --app-soft:rgba(214,96,42,.18);
  --out:#1E7F72; --in:#4B57B0; --spill:#C98A1E;
  --warn:#A86A10; --warn-soft:#F7ECD6; --crit:#AE3B2C; --crit-soft:#F6DEDA; --ok:#2E7A4B; --ok-soft:#DDEFE3;
  --map:#E9ECE6; --street:#FFFFFF; --street-main:#FBFBF9; --street-edge:#D6DAD2;
  --flash:#FBE7B8;
  --sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111514; --surface:#181D1C; --sunk:#0D1110; --line:#2A3230; --line-2:#3A4441;
  --ink:#E5EAE8; --muted:#9BA5A1; --faint:#6C7673;
  --accent:#6CC0B5; --accent-soft:#1D3532; --on-accent:#0D1110;
  --app:#F08A4F; --app-soft:rgba(240,138,79,.22);
  --out:#4FC2B2; --in:#8E99F2; --spill:#E2AA48;
  --warn:#E2AA48; --warn-soft:#33291A; --crit:#EF8A7A; --crit-soft:#3A2220; --ok:#7CCB98; --ok-soft:#1C3125;
  --map:#151A19; --street:#232A28; --street-main:#2A3230; --street-edge:#1C2221;
  --flash:#4A3C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111514; --surface:#181D1C; --sunk:#0D1110; --line:#2A3230; --line-2:#3A4441;
  --ink:#E5EAE8; --muted:#9BA5A1; --faint:#6C7673;
  --accent:#6CC0B5; --accent-soft:#1D3532; --on-accent:#0D1110;
  --app:#F08A4F; --app-soft:rgba(240,138,79,.22);
  --out:#4FC2B2; --in:#8E99F2; --spill:#E2AA48;
  --warn:#E2AA48; --warn-soft:#33291A; --crit:#EF8A7A; --crit-soft:#3A2220; --ok:#7CCB98; --ok-soft:#1C3125;
  --map:#151A19; --street:#232A28; --street-main:#2A3230; --street-edge:#1C2221;
  --flash:#4A3C1A; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Login */
.login{height:100%;display:grid;place-items:center;padding-block:24px;overflow:auto}
.login-card{width:min(380px,100%);display:flex;flex-direction:column;gap:20px}
.login h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;margin:0;text-align:center;color:var(--muted)}
.login form{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
.login h2{margin:0;font-size:18px;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--muted);font-weight:500}
.input{height:38px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:0 12px}
.btn{height:36px;border-radius:var(--r);border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.login small{color:var(--faint);font-size:12px;text-align:center}

/* Shell */
#app{height:100%;display:flex;flex-direction:column}
.topbar{flex:0 0 48px;height:48px;display:flex;align-items:center;gap:16px;background:var(--surface);border-bottom:1px solid var(--line);min-width:0}
.tb-left{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 0}
.brand{font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.brand i{font-style:normal;color:var(--app)}
.crumb{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px}
.crumb button:hover{color:var(--ink)}
.crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis}
.tb-center{flex:0 1 auto;display:flex;justify-content:center}
.switcher{height:30px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:0 8px;max-width:260px}
.tb-right{flex:1 1 0;display:flex;justify-content:flex-end;align-items:center;gap:10px}
.pool{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;background:var(--sunk);white-space:nowrap;display:flex;gap:6px;align-items:center}
.pool .bar{width:42px;height:4px;border-radius:2px;background:var(--line-2);overflow:hidden}
.pool .bar span{display:block;height:100%;background:var(--accent)}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.avatar.lg{width:56px;height:56px;font-size:18px}
.avatar.alt{background:var(--sunk);color:var(--muted)}
button.brand{border:0;background:none;padding:0;font-size:15px}
.nav{display:flex;align-self:stretch;margin-left:12px}
.navlink{border:0;background:none;padding:0 12px;color:var(--muted);font-weight:500;font-size:13px;border-bottom:2px solid transparent;border-top:2px solid transparent;white-space:nowrap}
.navlink:hover{color:var(--ink)}
.navlink[aria-current="page"]{color:var(--ink);border-bottom-color:var(--app)}
.navlink .ct{font-family:var(--mono);font-size:11px;color:var(--faint);margin-left:4px}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:9px;width:14px;height:14px;color:var(--faint);pointer-events:none}
.search input{height:30px;width:210px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--bg);padding:0 10px 0 28px;font-size:13px}
.bell{position:relative}
.bell .badge{position:absolute;top:1px;right:0;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--app);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;line-height:1}
.profbtn{display:flex;align-items:center;gap:8px;border:0;background:none;padding:3px 6px 3px 3px;border-radius:999px;font-size:13px;font-weight:500}
.profbtn:hover,.profbtn[aria-expanded="true"]{background:var(--sunk)}
.profbtn .car{color:var(--faint);font-size:10px}
.menu{position:fixed;z-index:40;background:var(--surface);border:1px solid var(--line-2);border-radius:10px;box-shadow:0 14px 36px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column;max-height:70vh;overflow:auto;animation:rise .16s ease-out}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0;width:100%}
.mi{display:flex;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;gap:10px;align-items:flex-start;font-size:13px}
.mi:hover,.mi:focus-visible{background:var(--sunk)}
.mi .sub{display:block;font-size:12px;color:var(--muted)}
.mi .t{display:block;font-size:11px;color:var(--faint);font-family:var(--mono);margin-top:2px}
.mh{display:flex;gap:10px;align-items:center;padding:8px 10px}
.mh b{display:block}
.mh span.e{font-size:12px;color:var(--muted)}
.mhd{display:flex;justify-content:space-between;align-items:center;padding:6px 10px 8px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);font-size:12px;font-weight:500}
.ndot{width:7px;height:7px;border-radius:50%;flex:none;margin-top:6px;background:transparent}
.unread .ndot{background:var(--app)}
.unread{font-weight:500}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;font-size:13px;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden;flex:none}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:5px 10px;font-size:12px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .ct{font-family:var(--mono);opacity:.6;margin-left:4px}
.m-only{display:none}
.bc{display:flex;gap:6px;font-size:12px;color:var(--muted);align-items:center;flex-wrap:wrap}
.bc button{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-decoration-color:var(--line-2);text-underline-offset:3px;font-size:12px}
.bc button:hover{color:var(--ink)}
.bc .sep{color:var(--faint)}
.bc [aria-current]{color:var(--ink);font-weight:500}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.input.sm{height:32px;font-size:13px;width:240px;max-width:100%}
.toast{position:fixed;z-index:60;bottom:calc(16px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:rise .2s ease-out;max-width:calc(100% - 32px)}
.empty-row{padding:32px 16px;text-align:center;color:var(--muted)}
.prof-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:24px;align-items:start}
.prof-card{padding:20px;display:flex;flex-direction:column;gap:16px}
.prof-id{display:flex;gap:14px;align-items:center}
.prof-id h2{margin:0;font-size:18px;font-weight:600}
.prof-id p{margin:0;color:var(--muted);font-size:13px}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.prefrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.prefrow:last-child{border-bottom:0}
.prefrow .d{display:block;font-size:12px;color:var(--muted)}
.switch{width:36px;height:20px;border-radius:10px;border:0;background:var(--line-2);position:relative;flex:none;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(16px)}
.act{display:flex;flex-direction:column}
.act div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13px}
.act div:last-child{border-bottom:0}
.act .t{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.qa{display:flex;flex-direction:column;gap:4px}
.qa .q{font-size:12px;color:var(--muted);font-weight:500}
.sig{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.sig b{color:var(--ink);font-family:"Brush Script MT","Segoe Script",cursive;font-size:18px;font-weight:400}

/* Map drawer */
.drawer{position:relative;flex:0 0 auto;height:38%;background:var(--map);border-bottom:1px solid var(--line);overflow:hidden;transition:height .38s cubic-bezier(.2,.7,.2,1)}
.drawer[data-state="collapsed"]{height:44px}
.drawer[data-state="max"]{height:85%}
.ribbon{position:absolute;inset:0 0 auto;height:44px;display:flex;align-items:center;gap:10px;background:var(--surface);font-size:13px;min-width:0}
.ribbon .dot{width:9px;height:9px;border-radius:50%;background:var(--app);box-shadow:0 0 0 4px var(--app-soft);flex:none}
.ribbon .txt{font-family:var(--mono);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
.ribbon .txt b{font-family:var(--sans);font-weight:600;font-size:13px}
.mapwrap{position:absolute;inset:0}
.mapwrap svg{width:100%;height:100%;display:block}
.drawer[data-state="collapsed"] .mapwrap,.drawer[data-state="collapsed"] .overlay{visibility:hidden}
.drawer:not([data-state="collapsed"]) .ribbon{visibility:hidden}

.overlay{position:absolute;display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto}
.ov-layers{top:10px;left:max(12px,env(safe-area-inset-left,0px));max-width:calc(100% - 200px)}
.ov-ctrl{top:10px;right:max(12px,env(safe-area-inset-right,0px))}
.ov-legend{bottom:10px;left:max(12px,env(safe-area-inset-left,0px))}
.chipbar{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.toggle{border:0;background:transparent;border-radius:5px;padding:4px 8px;font-family:var(--mono);font-size:11px;display:flex;align-items:center;gap:6px;color:var(--muted)}
.toggle .sw{width:14px;height:3px;border-radius:2px;background:currentColor}
.toggle[aria-pressed="true"]{color:var(--ink);background:var(--sunk)}
.toggle[data-v="out"] .sw{background:var(--out)}
.toggle[data-v="in"] .sw{background:var(--in)}
.toggle[data-v="spill"] .sw{background:repeating-linear-gradient(90deg,var(--spill) 0 3px,transparent 3px 5px)}
.toggle[aria-pressed="false"] .sw{opacity:.35}
.toggle:disabled{opacity:.45;cursor:not-allowed}
.icobtn{width:28px;height:28px;border:0;border-radius:5px;background:transparent;display:grid;place-items:center;color:var(--muted)}
.icobtn:hover{background:var(--sunk);color:var(--ink)}
.icobtn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.icobtn svg{width:16px;height:16px}
.legend{display:flex;gap:12px;align-items:center;font-size:11px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.legend span{display:flex;align-items:center;gap:6px}
.lg-app{width:10px;height:10px;border-radius:50%;background:var(--app);box-shadow:0 0 0 3px var(--app-soft)}
.lg-node{width:7px;height:7px;border-radius:50%;background:var(--faint)}

/* SVG map */
.m-street{stroke:var(--street);fill:none;stroke-linecap:square}
.m-street-edge{stroke:var(--street-edge);fill:none}
.m-main{stroke:var(--street-main)}
.m-stlabel{fill:var(--faint);font-family:var(--mono);font-size:11px;letter-spacing:.18em}
.m-node{cursor:pointer;outline:none}
.m-node circle.core{fill:var(--faint);transition:r .2s}
.m-node.on circle.core{fill:var(--ink)}
.m-node.dim{opacity:.35}
.m-node .lbl{fill:var(--muted);font-size:13px;font-family:var(--sans);paint-order:stroke;stroke:var(--map);stroke-width:4px;stroke-linejoin:round}
.m-node.on .lbl{fill:var(--ink);font-weight:500}
.m-node:hover circle.core,.m-node:focus-visible circle.core{fill:var(--accent)}
.m-app .halo{fill:var(--app);opacity:.18}
.m-app .core{fill:var(--app) !important;stroke:var(--surface);stroke-width:2.5}
.m-app .badge rect{fill:var(--ink)}
.m-app .badge text{fill:var(--bg);font-family:var(--mono);font-size:11px;font-weight:500}
.m-app .lbl{fill:var(--ink);font-size:14px;font-weight:600}
.m-app.sel .halo{opacity:.28}
.m-app.pulse .halo{animation:pulse 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.18}50%{transform:scale(1.35);opacity:.08}}
.m-edge{fill:none;stroke-width:2.2}
.m-edge.out{stroke:var(--out)}
.m-edge.in{stroke:var(--in)}
.m-edge.spill{stroke:var(--spill);stroke-dasharray:5 6;stroke-width:1.6}
.anim .m-edge.out,.anim .m-edge.in{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .9s cubic-bezier(.3,.6,.2,1) forwards}
.anim .m-edge.spill,.anim .m-ring{opacity:0;animation:fade .6s .5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}

.mpop{position:absolute;z-index:5;width:260px;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.mpop .k{font-family:var(--mono);font-size:11px;color:var(--faint)}
.mpop h4{margin:0;font-size:14px}
.mpop p{margin:0;color:var(--muted)}
.mpop .row{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.tag.out{color:var(--out)} .tag.in{color:var(--in)} .tag.spill{color:var(--spill)}

/* Main workspace */
.ws{flex:1 1 auto;min-height:0;position:relative;display:flex;flex-direction:column}
.peek{flex:1;display:flex;align-items:center;gap:12px;background:var(--surface);border-top:1px solid var(--line);font-size:13px;min-height:0}
.peek .txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.peek .txt b{color:var(--ink)}

/* Stage 1 */
.triage{flex:1;min-height:0;overflow:auto;padding-block:20px 32px}
.triage-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.triage-head h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.triage-head .stats{display:flex;gap:18px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.triage-head .stats b{color:var(--ink);font-family:var(--mono);font-weight:500}
.triage-grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:24px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line)}
.panel-h h2{margin:0;font-size:14px;font-weight:600}
.tablewrap{overflow-x:auto}
table.q{width:100%;border-collapse:collapse;font-size:13px}
table.q th{text-align:left;font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:10px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
table.q td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
table.q tr:last-child td{border-bottom:0}
table.q tbody tr{cursor:pointer}
table.q tbody tr:hover td{background:var(--sunk)}
table.q td.r,table.q th.r{text-align:right}
.biz b{font-weight:600;display:block}
.biz span{color:var(--muted);font-size:12px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

function mapSVG(){
  const sel = S.screen==='review' ? BY[S.current] : null;
  const connected = new Map();
  if(sel){ ['out','in','spill'].forEach(t=>{ if(S.layers[t]) sel.edges[t].forEach(e=>connected.set(e[0],t)); }); }
  const anim = sel && S.animSel !== sel.id && !RM;
  const H = [90,240,400], V = [180,460,740,1020];
  let s = `<svg viewBox="0 0 1200 480" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Top-down map of the ${CORRIDOR}" class="${anim?'anim':''}">
    <defs>
      <radialGradient id="spillGrad"><stop offset="0" style="stop-color:var(--spill);stop-opacity:.28"/><stop offset="1" style="stop-color:var(--spill);stop-opacity:0"/></radialGradient>
      ${['out','in'].map(t=>`<marker id="ar-${t}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" style="fill:var(--${t})"/></marker>`).join('')}
    </defs>`;
  H.forEach((y,i)=>{ const w = i===1?30:16; s += `<line class="m-street-edge" x1="-900" y1="${y}" x2="2100" y2="${y}" stroke-width="${w+2}"/><line class="m-street ${i===1?'m-main':''}" x1="-900" y1="${y}" x2="2100" y2="${y}" stroke-width="${w}"/>`; });
  V.forEach(x=>{ s += `<line class="m-street-edge" x1="${x}" y1="-900" x2="${x}" y2="1400" stroke-width="16"/><line class="m-street" x1="${x}" y1="-900" x2="${x}" y2="1400" stroke-width="14"/>`; });
  s += `<text class="m-stlabel" x="600" y="244" text-anchor="middle">MARKET ST · CENTRAL MARKET</text>
        <text class="m-stlabel" x="320" y="94">TURK / GOLDEN GATE AVE</text><text class="m-stlabel" x="320" y="404">MISSION ST</text>`;
  if(sel){
    if(S.layers.spill) s += `<circle class="m-ring" cx="${sel.x}" cy="${sel.y}" r="190" fill="url(#spillGrad)"/>`;
    let flip = 1;
    const curve = (x1,y1,x2,y2,k)=>{ const mx=(x1+x2)/2,my=(y1+y2)/2,dx=x2-x1,dy=y2-y1,len=Math.hypot(dx,dy)||1; flip=-flip; const o=.16*len*flip; return `M${x1} ${y1} Q${mx - dy/len*o} ${my + dx/len*o} ${x2} ${y2}`; };
    const shorten = (x1,y1,x2,y2,d)=>{ const len=Math.hypot(x2-x1,y2-y1)||1; return [x2-(x2-x1)/len*d, y2-(y2-y1)/len*d]; };
    if(S.layers.spill) sel.edges.spill.forEach(([k])=>{ const n=NODES[k]; if(n) s+=`<path class="m-edge spill" d="${curve(sel.x,sel.y,n.x,n.y)}"/>`; });
    if(S.layers.out) sel.edges.out.forEach(([k])=>{ const n=NODES[k]; if(n){ const [ex,ey]=shorten(sel.x,sel.y,n.x,n.y,10); s+=`<path class="m-edge out" pathLength="1" marker-end="url(#ar-out)" d="${curve(sel.x,sel.y,ex,ey)}"/>`; } });
    if(S.layers.in) sel.edges.in.forEach(([k])=>{ const n=NODES[k]; if(n){ const [ex,ey]=shorten(n.x,n.y,sel.x,sel.y,16); s+=`<path class="m-edge in" pathLength="1" marker-end="url(#ar-in)" d="${curve(n.x,n.y,ex,ey)}"/>`; } });
  }
  Object.entries(NODES).forEach(([k,n])=>{
    const on = connected.has(k), dim = sel && !on;
    const lx = n.x > 1050 ? -10 : 10, anchor = n.x > 1050 ? 'end' : 'start';
    s += `<g class="m-node ${on?'on':''} ${dim?'dim':''}" data-act="node" data-n="${k}" tabindex="0" role="button" aria-label="${esc(n.name)}">
      <circle cx="${n.x}" cy="${n.y}" r="14" fill="transparent"/>
      <circle class="core" cx="${n.x}" cy="${n.y}" r="${on?6:4.5}"/>
      ${on || !sel ? `<text class="lbl" x="${n.x+lx}" y="${n.y+4}" text-anchor="${anchor}">${esc(n.name)}</text>`:''}
      <title>${esc(n.name)} · ${esc(n.kind)}</title></g>`;
  });
  APPS.forEach(a=>{
    const isSel = sel && sel.id===a.id;
    const lx = a.x > 1050 ? -18 : 18, anchor = a.x > 1050 ? 'end' : 'start';
    const bx = a.x > 1050 ? a.x-46 : a.x+10;
    s += `<g class="m-node m-app ${isSel?'sel':''} ${(!sel||isSel)?'pulse':''} ${sel&&!isSel?'dim':''}" data-act="node" data-n="${a.id}" tabindex="0" role="button" aria-label="${esc(a.name)}, impact score ${a.impact}">
      <circle class="halo" cx="${a.x}" cy="${a.y}" r="${isSel?22:17}"/>
      <circle class="core" cx="${a.x}" cy="${a.y}" r="${isSel?10:8}"/>
      <g class="badge"><rect x="${bx}" y="${a.y-30}" width="36" height="18" rx="4"/><text x="${bx+18}" y="${a.y-17}" text-anchor="middle">${a.impact}</text></g>
      <text class="lbl" x="${a.x+lx}" y="${a.y+20}" text-anchor="${anchor}">${esc(a.name)}</text>
      <title>#${a.id} ${esc(a.name)} · Impact ${a.impact}</title></g>`;
  });
  return s + '</svg>';
}

  left = Math.max(8, Math.min(left, dr.width - 270)); top = Math.max(52, Math.min(top, dr.height - 170));
  let html = '';
  if(BY[nodeKey]){

  } else {
    const n = NODES[nodeKey], a = S.screen==='review' ? BY[S.current] : null;
    let rel = null;
    if(a){ for(const t of ['out','in','spill']){ const e = a.edges[t].find(x=>x[0]===nodeKey); if(e){ rel=[t,e]; break; } } }
    if(a && rel){
      const [t,e] = rel;
      const label = {out:'1st-Degree Supplier',in:'1st-Degree Buyer',spill:'2nd-Degree Spillover'}[t];
      const body = t==='out' ? `Receives ${fk(e[1])}/yr from ${esc(a.name)}. Estimated ${e[2]}% revenue dependency.`
                 : t==='in' ? `Spends ${fk(e[1])}/yr at ${esc(a.name)}, about ${e[2]}% of its cost of goods.`
                 : `Shares foot traffic with ${esc(a.name)}. About ${e[1]}% of weekday visits overlap.`;
      html = `<span class="tag ${t}">${label}</span><h4>${esc(n.name)}</h4><p>${body}</p>
        <div class="row"><button class="btn sm" data-act="ask-link" data-n="${nodeKey}">Ask AI about this link</button><button class="btn ghost sm" data-act="close-pop">Close</button></div>`;
    } else if(n) {
      html = `<span class="k">${esc(n.kind)}</span><h4>${esc(n.name)}</h4><p>${a ? 'No filed direct link with '+esc(a.name)+'.' : 'Corridor business in Central Market.'}</p>
        <div class="row"><button class="btn ghost sm" data-act="close-pop">Close</button></div>`;
    }
  }
  if(!html){ pop.innerHTML=''; return; }
  pop.innerHTML = `<div class="mpop" style="left:${left}px;top:${top}px" role="dialog">${html}</div>`;
}

function formatAgentMarkdown(md){
  if(!md) return '';
  const lines = String(md).split('\n');
  let html = '', inList = false, inCode = false, codeBuf = [];
  const inline = s => esc(s)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  for(const raw of lines){
    const line = raw.trimEnd();
    if(line.trim().startsWith('```')){
      if(inList){ html += '</ul>'; inList = false; }
      if(inCode){ html += `<pre>${esc(codeBuf.join('\n'))}</pre>`; codeBuf = []; inCode = false; }
      else { inCode = true; }
      continue;
    }
    if(inCode){ codeBuf.push(raw); continue; }
    const trimmed = line.trim();
    if(!trimmed){
      if(inList){ html += '</ul>'; inList = false; }
      continue;
    }
    if(/^#{1,4}\s+/.test(trimmed)){
      if(inList){ html += '</ul>'; inList = false; }
      const txt = trimmed.replace(/^#{1,4}\s+/, '');
      html += `<p style="margin-top:6px"><b>${inline(txt)}</b></p>`;
    } else if(/^[-*•]\s+/.test(trimmed) || /^\d+\.\s+/.test(trimmed)){
      if(!inList){ html += '<ul>'; inList = true; }
      const item = trimmed.replace(/^([-*•]|\d+\.)\s+/, '');
      html += `<li>${inline(item)}</li>`;
    } else if(/^>\s*/.test(trimmed)){
      if(inList){ html += '</ul>'; inList = false; }
      html += `<blockquote>${inline(trimmed.replace(/^>\s*/, ''))}</blockquote>`;
    } else {
      if(inList){ html += '</ul>'; inList = false; }
      html += `<p>${inline(trimmed)}</p>`;
    }
  }
  if(inList) html += '</ul>';
  if(inCode) html += `<pre>${esc(codeBuf.join('\n'))}</pre>`;
  return html;
}

function msgHTML(m){
  if(m.role==='user') return `<div class="msg user"><p>${esc(m.text)}</p></div>`;
  if(m.role==='typing') return `<div class="msg"><span class="who">Assistant <span class="adk-src">${esc(m.agent||S.agentApp)}</span></span><div class="typing"><i></i><i></i><i></i><span>Querying Cloud Run ADK & BigQuery graph…</span></div></div>`;
  if(m.kind==='summary'){
    const a = BY[m.app];
    return `<div class="msg"><span class="who">Assistant <span class="adk-src">ADK Ready · ${esc(a.id)}</span></span><div class="summary">
      <p>${esc(a.name)} (<span class="mono">${esc(a.id)}</span>) requests <b>${fmt(a.ask)}</b> to ${esc(a.use.charAt(0).toLowerCase()+a.use.slice(1))}. ${m.lead||''}</p>
      <div class="stats"><div><b>${a.impact}</b><span>Impact score</span></div><div><b>${a.edges.out.length}/${a.edges.in.length}</b><span>Suppliers / buyers</span></div>
        <div><b>${fk(sum(a.edges.out)+sum(a.edges.in))}</b><span>Linked $/yr</span></div><div><b>${a.missing.length + (variance(a)>.08?1:0)}</b><span>Open flags</span></div></div>
      ${chipsHTML(m.chips)}</div></div>`;

  const srcBadge = m.source ? `<span class="adk-src">${esc(m.source)}</span>` : '';

    <div class="next"><span class="label">Suggested next steps / Context needed</span>
      ${(m.flags||[]).map(f=>`<div class="flag">${f}</div>`).join('')}${chipsHTML(m.chips||[])}</div></div>`;

const pill = (side,tab,anchor,label) => `<button class="src" data-act="src" data-src="${side}|${tab}|${anchor}">${side==='L'?'←':'→'} ${esc(label)}</button>`;

function flagsFor(a){
  const f = a.missing.map(k=>`Missing ${esc(docName(a,k))} — ask applicant? ${pill('L','docs','doc-'+k,'Documents')}`);
  const v = variance(a); if(v>.08) f.push(`Reported revenue is ${(v*100).toFixed(1)}% above the tax return — confirm? ${pill('L','fin','rev','Financials')}`);
  if(a.notes.lease) f.push(`${esc(a.notes.lease)} ${pill('L','docs','doc-lease','Lease')}`);
  if(!f.length) f.push('No missing documents. Ready for live ADK evaluation & recommendation.');
  return f;
}
const requestChip = a => a.missing.length ? 'Draft request for the '+docName(a,a.missing[0]).replace(/^Equipment quote — .*/,'contractor quote') : 'Compare with '+rival(a).name;
const rival = a => APPS.slice().sort((x,y)=>y.impact-x.impact).find(x=>x.id!==a.id && Math.abs(x.impact-a.impact)<=15) || APPS.find(x=>x.id!==a.id);
const topDep = a => [...a.edges.out.map(e=>['out',...e]),...a.edges.in.map(e=>['in',...e])].sort((x,y)=>y[3]-x[3])[0];

function detectLocalArtifact(a, text){
  const t = text.toLowerCase();
  if(/memo/.test(t)) return {art:'memo', tight:/conditions|tight/.test(t), chips:['Visualize 2-Degree Network Impact','Audit Financial Discrepancies',requestChip(a)]};
  if(/(network|visual|chart|graph|map)/.test(t)){
    S.layers={out:true,in:true,spill:true};
    return {art:'network', tight:false, chips:['Generate Grant Memo',`What is the 2-hop supply cascade for ${a.name} (${a.id})?`]};
  }
  if((/report/.test(t) && /(audit|discrep)/.test(t)) || /discrepancy report|audit financial/i.test(t)){
    return {art:'audit', tight:false, chips:['Generate Grant Memo',requestChip(a)]};
  }
  return {art:null, tight:false, chips:['Generate Grant Memo','Visualize 2-Degree Network Impact','Audit Financial Discrepancies']};
}

async function send(text){
  text = text.trim(); if(!text) return;
  const a = BY[S.current];
  const sw = /^switch to (.+)$/i.exec(text);
  if(sw){ const o = APPS.find(x=>x.name.toLowerCase()===sw[1].toLowerCase()); if(o){ openBiz(o.id,'switch'); return; } }
  const chat = S.chats[a.id];
  chat.push({role:'user',text});
  const chosenAgent = S.agentApp || 'corridor_coordinator';
  const typing = {role:'typing', agent:chosenAgent};
  chat.push(typing);
  renderChat();
  const id = a.id;
  const hint = detectLocalArtifact(a, text);
  if(hint.art){
    if(S.current===id){
      makeArtifact(BY[id], hint.art, hint.tight);
      if(/network|visual|chart|graph|map/i.test(text)) refreshMap();
    } else {
      makeArtifact(BY[id], hint.art, hint.tight, true);
    }
  }
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        message:text,
        selected_business_id:id,
        budget:ROUND_BUDGET,
        risk_reduction_pct:45.0,
        weighting_mode:'compound_intensity',
        equity_carveout:false,
        agent_app:chosenAgent,
        client_id:S.clientId
      })
    });
    const data = await res.json().catch(()=>({}));
    const c = S.chats[id];
    const idx = c.indexOf(typing);
    if(idx !== -1) c.splice(idx, 1);
    if(!res.ok){
      const errDetail = data.detail || `HTTP ${res.status}`;
      c.push({
        role:'ai',
        source:`Error (${chosenAgent})`,
        tools:[],
        html:`<div class="callout crit"><b>Live ADK Agent Error:</b> ${esc(errDetail)}</div>`,
        flags:flagsFor(BY[id]),
        chips:hint.chips
      });
    } else {
      const formatted = formatAgentMarkdown(data.reply || '');
      const refPills = `<p style="margin-top:6px">Workspace references: ${pill('L','overview','impact','Impact')} ${pill('L','overview','network','Network')} ${pill('L','fin','rev','Financials')}</p>`;
      c.push({
        role:'ai',
        source:data.source || `Cloud Run ADK (${chosenAgent})`,
        tools:data.tool_calls || [],
        html:formatted + refPills,
        flags:flagsFor(BY[id]),
        chips:hint.chips
      });
      if(/memo|recommend|allocation/i.test(text) && data.reply){
        makeLiveAdkArtifact(BY[id], data.reply, data.source, data.tool_calls);
      }
      log(`ADK (${data.agent_app || chosenAgent}) answered for ${BY[id].name}`);
    }
  } catch (err) {
    const c = S.chats[id];
    const idx = c.indexOf(typing);
    if(idx !== -1) c.splice(idx, 1);
    c.push({
      role:'ai',
      source:'Connection Error',
      tools:[],
      html:`<div class="callout crit"><b>Could not reach /api/chat:</b> ${esc(err.message || String(err))}</div>`,
      flags:flagsFor(BY[id]),
      chips:hint.chips
    });
  }
  if(S.current===id) renderChat();
}

function makeLiveAdkArtifact(a, replyMd, source, tools){
  const list = S.arts[a.id] || (S.arts[a.id]=[]);
  let art = list.find(x=>x.kind==='adk');
  const toolLine = (tools && tools.length) ? ` · Tools: ${tools.join(', ')}` : '';
  const secs = [
    `<div class="kicker">${esc(source || 'CLOUD RUN ADK')} · #${esc(a.id)}${esc(toolLine)}</div><h1>${esc(a.name)}: Live Agent Analysis</h1>`,
    `<section id="R-adk-body">${formatAgentMarkdown(replyMd)}</section>`
  ];
  if(!art){ art = {kind:'adk',title:'Live ADK Memo',secs:[]}; list.push(art); }
  art.secs = secs;
  art.pending = null;
  art.created = timeLabel();
  const u = ui(a.id); u.layout='2B'; u.art='adk';
  if(S.current===a.id){
    const rv = $('#review'); if(rv) rv.classList.add('l2b');
    renderArt();
    renderTop();
  }
}

/* ---------- Artifacts ---------- */
function recLine(a){
  const v = variance(a);
  if(v>.12) return 'hold pending financial clarification';
  if(a.missing.length) return `fund ${fmt(a.ask)}, conditional on the ${docName(a,a.missing[0]).replace(/^Equipment quote — /,'quote from ')}`;
  return `fund ${fmt(a.ask)} in full`;
}

function artSections(a, kind, tight){
  const total = sum(a.edges.out)+sum(a.edges.in), v = variance(a);
  if(kind==='memo'){
    const conds = tight
      ? [`Upload ${a.missing.length?docName(a,a.missing[0]):'Q4 bank statement'} before disbursement`,`Written explanation of the ${(v*100).toFixed(1)}% revenue variance, within 14 days`,`Proof of stabilization / installation (invoice from ${a.fin.vendor}) within 90 days of award`]
      : [a.missing.length?`Receipt of the ${docName(a,a.missing[0])}`:'Standard reporting at 6 and 12 months', v>.08?'Explanation of the revenue variance':'Invoice matching the quote on file', a.notes.lease?'Evidence of lease renewal or landlord consent':'Retain listed staff for 12 months'];
    return [
      `<div class="kicker">GRANT MEMO · #${a.id} · DRAFT ${tight?'v2':'v1'}</div><h1>${esc(a.name)}: ${fmt(a.ask)} request</h1>`,
      `<section id="R-m-rec"><h2>1. Recommendation</h2><div class="rec"><b>${recLine(a).replace(/^./,c=>c.toUpperCase())}</b><span class="mono" style="color:var(--muted)">Impact ${a.impact}/100</span></div></section>`,
      `<section id="R-m-sum"><h2>2. Applicant</h2><p>${esc(a.cat)} (<span class="mono">${esc(a.id)}</span>) run by ${esc(a.owner)} since ${a.since}, ${a.staff} staff. The grant would ${esc(a.use.charAt(0).toLowerCase()+a.use.slice(1))}, backed by a ${fmt(a.fin.quote)} quote from ${esc(a.fin.vendor)} ${pill('L','docs','doc-quote','Quote')}.</p></section>`,
      `<section id="R-m-impact"><h2>3. Corridor impact</h2><p>${a.edges.out.length} corridor suppliers receive ${fk(sum(a.edges.out))}/yr and ${a.edges.in.length} corridor buyers spend ${fk(sum(a.edges.in))}/yr here, ${fk(total)} in direct local trade ${pill('L','overview','network','Network')}. The largest dependency is ${esc(nodeName(topDep(a)[1]))} at ${topDep(a)[3]}%. Score detail: ${a.parts.map(p=>p[0].toLowerCase()+' '+p[1]+'/'+p[2]).join(', ')} ${pill('L','overview','impact','Impact')}.</p></section>`,
      `<section id="R-m-fin"><h2>4. Financial review</h2><p>Self-reported revenue of ${fmt(a.fin.appRev)} is ${(v*100).toFixed(1)}% ${v>=0?'above':'below'} the 2025 tax return ${pill('L','fin','rev','Revenue')}. ${v>.08?'This exceeds the 8% threshold and needs an explanation before award.':'This is within program tolerance.'} ${a.fin.q.includes(null)?'Q3 deposits are unverified.':''}</p></section>`,
      `<section id="R-m-cond"><h2>5. Conditions</h2><ul>${conds.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></section>`
    ];
  }
  if(kind==='network'){
    const rows = [['Revenue out · 1st-degree suppliers','out',a.edges.out],['Revenue in · 1st-degree buyers','in',a.edges.in]];
    const max = Math.max(...a.edges.out.map(e=>e[1]),...a.edges.in.map(e=>e[1]));
    const L=170, W=300, rowH=24; let y=12, body='';
    const ticks=[0,.25,.5,.75,1].map(f=>f*max);
    rows.forEach(([g,cls,list])=>{
      body += `<text class="c-grp" x="0" y="${y+10}">${g.toUpperCase()}</text>`; y+=20;
      list.slice().sort((p,q)=>q[1]-p[1]).forEach(e=>{
        const w = e[1]/max*W;
        body += `<text class="c-lbl" x="${L-8}" y="${y+14}" text-anchor="end">${esc(nodeName(e[0]))}</text>
          <rect x="${L}" y="${y+4}" width="${w}" height="14" rx="2" style="fill:var(--${cls})"/>
          <text class="c-val" x="${L+w+6}" y="${y+15}">${fk(e[1])} · ${e[2]}%</text>`; y+=rowH; });
      y+=8;
    });
    const spillEst = total*.35;
    const sw = Math.min(spillEst/max*W, W);
    body += `<text class="c-grp" x="0" y="${y+10}">2ND-DEGREE SPILLOVER · ESTIMATE</text>`; y+=20;
    body += `<text class="c-lbl" x="${L-8}" y="${y+14}" text-anchor="end">Indirect businesses</text><rect x="${L}" y="${y+4}" width="${sw}" height="14" rx="2" style="fill:none;stroke:var(--spill);stroke-dasharray:4 3;stroke-width:1.5"/><text class="c-val" x="${L+sw+6}" y="${y+15}">${fk(spillEst)}</text>`; y+=rowH+6;
    const grid = ticks.map(tk=>`<line class="c-grid" x1="${L+tk/max*W}" y1="28" x2="${L+tk/max*W}" y2="${y-8}"/><text class="c-val" x="${L+tk/max*W}" y="${y+6}" text-anchor="middle">${fk(tk)}</text>`).join('');
    return [
      `<div class="kicker">NETWORK IMPACT · #${a.id}</div><h1>${esc(a.name)}: 2-degree corridor network</h1>`,
      `<section id="R-n-tiles"><div class="tiles"><div class="tile out"><b>${fk(sum(a.edges.out))}</b><span>Revenue out to ${a.edges.out.length} suppliers</span></div>
        <div class="tile in"><b>${fk(sum(a.edges.in))}</b><span>Revenue in from ${a.edges.in.length} buyers</span></div>
        <div class="tile spill"><b>~${fk(spillEst)}</b><span>2nd-degree, estimated</span></div></div></section>`,
      `<section id="R-n-chart"><h2>Annual flows by partner</h2><div class="chartwrap"><svg viewBox="0 0 560 ${y+14}" role="img" aria-label="Bar chart of annual flows">${grid}${body}</svg></div></section>`,
      `<section><h2>Method</h2><p>Direct flows come from the applicant's supplier and buyer network in Central Market ${pill('L','overview','network','Network')}. Percentages are each partner's estimated dependency. The 2nd-degree figure applies a 0.35 local multiplier to direct flows and covers the consumer zone within 400 m, shown as the shaded ring on the map.</p></section>`
    ];
  }
  const known = a.fin.q.filter(x=>x!=null), ann = known.reduce((s,x)=>s+x,0)/known.length*4;
  const sev = x => x>.12?'<span class="var-crit">High</span>':x>.08?'<span class="var-warn">Medium</span>':'<span class="var-ok">Low</span>';
  const staffFiled = a.fin.staffFiled.match(/\d+/g).map(Number).reduce((s,x)=>s+x,0);
  return [
    `<div class="kicker">DISCREPANCY REPORT · #${a.id}</div><h1>${esc(a.name)}: financial audit</h1>`,
    `<section id="R-a-table"><div class="tablewrap"><table class="fin"><thead><tr><th>Item</th><th class="r">Application</th><th class="r">Evidence</th><th class="r">Variance</th><th class="r">Severity</th></tr></thead><tbody>
      <tr><td>Revenue vs. 2025 tax return</td><td class="r">${fk(a.fin.appRev)}</td><td class="r">${fk(a.fin.taxRev)}</td><td class="r">${(v*100).toFixed(1)}%</td><td class="r">${sev(v)}</td></tr>
      <tr><td>Revenue vs. 2026 deposits</td><td class="r">${fk(a.fin.appRev)}</td><td class="r">${fk(ann)}</td><td class="r">${((a.fin.appRev-ann)/ann*100).toFixed(1)}%</td><td class="r">${sev((a.fin.appRev-ann)/ann)}</td></tr>
      <tr><td>Headcount vs. payroll</td><td class="r">${a.staff}</td><td class="r">${staffFiled}</td><td class="r">${staffFiled-a.staff>=0?'+':''}${staffFiled-a.staff}</td><td class="r">${sev(Math.abs(staffFiled-a.staff)/a.staff>.15?.1:0)}</td></tr>
      ${a.missing.map(k=>`<tr><td>${esc(docName(a,k))}</td><td class="r">—</td><td class="r">Missing</td><td class="r">—</td><td class="r"><span class="var-warn">Blocking</span></td></tr>`).join('')}
    </tbody></table></div></section>`,
    `<section><h2>Notes</h2><p>Figures come from the Financials tab ${pill('L','fin','rev','Revenue')} ${pill('L','fin','staff','Staffing')}. Deposits are annualized from the quarters on file.</p></section>`
  ];
}

function makeArtifact(a, kind, tight, silent){
  const titles = {memo:'Grant Memo',network:'Network Impact',audit:'Discrepancy Report',adk:'Live ADK Memo'};
  const list = S.arts[a.id] || (S.arts[a.id]=[]);
  let art = list.find(x=>x.kind===kind);
  const secs = artSections(a, kind, tight);
  if(!art){ art = {kind,title:titles[kind],secs:[]}; list.push(art); }
  art.secs = []; art.pending = secs;
  const u = ui(a.id); u.layout='2B'; u.art=kind;
  art.created = timeLabel();
  if(silent) { art.secs = secs; art.pending=null; return; }
  const rv = $('#review'); if(rv) rv.classList.add('l2b');
  renderArt();
  log(`Generated ${art.title} for ${a.name}`);
  const step = ()=>{
    if(!art.pending || !art.pending.length){ art.pending=null; toast(`${art.title} ready · saved to Reports`); renderTop(); return; }
    const s = art.pending.shift(); art.secs.push(s);
    if(S.current===a.id && ui(a.id).art===kind){
      const body = $('#art-doc'); if(body){ const d=document.createElement('div'); d.className='stream-in'; d.innerHTML=s; body.appendChild(d); }
    }
    setTimeout(step, RM?0:260);
  };
  setTimeout(step, RM?0:350);
}

function renderArt(){
  const a = BY[S.current], el = $('#art'); if(!el) return;
  const u = ui(a.id), list = S.arts[a.id]||[];
  const art = list.find(x=>x.kind===u.art) || list[0];
  if(!art){ el.innerHTML = `<div class="empty">Ask for a memo, report or chart and it will open here.</div>`; return; }
  el.innerHTML = `<div class="art-h"><div class="tabs" role="tablist">${list.map(x=>`<button class="tab" role="tab" data-act="art-tab" data-v="${x.kind}" aria-selected="${x===art}">${x.title}</button>`).join('')}</div>
      <button class="icobtn" data-act="art-close" aria-label="Close artifact window" title="Back to two columns">✕</button></div>
    <div class="art-body"><div class="doc-art" id="art-doc">${art.secs.map(s=>`<div>${s}</div>`).join('')}</div></div>`;
}

/* ---------- Navigation ---------- */
function openBiz(id, from){
  const a = BY[id];
  if(!S.chats[id]){
    const lead = from==='leader' ? 'Impact breakdown is loaded on the left.' : from==='map' ? 'Its corridor network is drawn on the map above.' : '';
    const chips = from==='leader' ? [`Explain the ${a.impact} impact score and 2-hop cascade for ${a.name}`,'Visualize 2-Degree Network Impact','Compare with '+rival(a).name]
                                  : ['Generate Grant Memo','Visualize 2-Degree Network Impact','Audit Financial Discrepancies'];
    S.chats[id] = [{role:'ai',kind:'summary',app:id,lead,chips}];
  }
  const u = ui(id); u.tab = 'overview';
  if(S.current!==id) log(`Opened #${id} ${a.name}`);
  if(from==='search') S.q='';
  S.screen = 'review'; S.current = id; S.pop = null; S.menu = null;
  if(from==='map'){ S.map='expanded'; }
  else if(from!=='switch'){ if(!S.pinned) S.map='collapsed'; }
  render();
  if(from==='leader'){ requestAnimationFrame(()=>{ const t=$('#L-impact'); if(t){ t.scrollIntoView({block:'start'}); t.classList.add('flash'); } }); }
}

function goSrc(s){
  const [side,tab,anchor] = s.split('|'); const u = ui(S.current);
  if(side==='L'){ if(u.tab!==tab){ u.tab=tab; renderLeft(); } }
  else { const list=S.arts[S.current]||[]; if(!list.find(x=>x.kind===tab)) return; u.layout='2B'; u.art=tab; $('#review').classList.add('l2b'); renderArt(); }
  requestAnimationFrame(()=>{ const el = document.getElementById((side==='L'?'L-':'R-')+anchor); if(el){ el.scrollIntoView({block:'center',behavior:RM?'auto':'smooth'}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); } });
}

/* ---------- Events ---------- */
document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act]');
  if(S.menu && !e.target.closest('.menu') && !(t && t.dataset.act==='menu') && e.target.id!=='q'){ S.menu=null; renderMenu(); }
  if(!t){ if(S.pop && !e.target.closest('.mpop')){ S.pop=null; const p=$('#mpop'); if(p) p.innerHTML=''; } return; }
  const act = t.dataset.act;
  switch(act){
    case 'demo-login': startSession(); break;
    case 'logout': S.screen='login'; S.current=null; S.menu=null; render(); break;
    case 'go': S.screen=t.dataset.v; S.current=null; S.menu=null; S.pop=null; if(S.screen==='triage'&&S.map==='collapsed'&&!S.pinned) S.map='expanded'; render(); break;
    case 'menu': S.menu = S.menu===t.dataset.v ? null : t.dataset.v; renderMenu(); break;
    case 'theme': S.theme=t.dataset.v; applyTheme(); renderMenu(); if(S.screen==='profile') renderWS(); break;
    case 'mark-read': S.notifs.forEach(n=>n.unread=false); renderTop(); renderMenu(); break;
    case 'notif': { const n=S.notifs[+t.dataset.i]; n.unread=false; S.menu=null; if(n.app) openBiz(n.app,'search'); else { renderTop(); renderMenu(); } break; }
    case 'filter': S.filter=t.dataset.v; renderWS(); break;
    case 'pref': S.prefs[t.dataset.v]=!S.prefs[t.dataset.v]; if(t.dataset.v==='keepMap') S.pinned=S.prefs.keepMap; t.setAttribute('aria-checked',S.prefs[t.dataset.v]); toast('Preference saved'); break;
    case 'open-report': { const u=ui(t.dataset.id); u.layout='2B'; u.art=t.dataset.k; openBiz(t.dataset.id,'report'); break; }
    case 'map': setMap(t.dataset.v); break;
    case 'pin': S.pinned=!S.pinned; S.prefs.keepMap=S.pinned; t.setAttribute('aria-pressed',S.pinned); toast(S.pinned?'Map will stay open when you open a business':'Map will collapse when you open a business'); break;
    case 'layer': S.layers[t.dataset.v]=!S.layers[t.dataset.v]; S.animSel=S.current; refreshMap(); break;
    case 'open': openBiz(t.dataset.id, t.dataset.from); break;
    case 'node': {
      const k = t.dataset.n;
      if(BY[k] && S.screen==='triage'){ openBiz(k,'map'); break; }
      if(BY[k] && k===S.current){ break; }
      S.pop=k; showPop(k); break; }
    case 'close-pop': S.pop=null; $('#mpop').innerHTML=''; break;
    case 'switch': openBiz(t.dataset.id,'switch'); break;
    case 'ask-link': { const n = nodeName(t.dataset.n); S.pop=null; $('#mpop').innerHTML=''; if(S.map==='max') setMap('expanded'); send(`How does ${BY[S.current].name} (${BY[S.current].id}) depend on ${n} and what is its cascade impact?`); break; }
    case 'prompt': send(t.dataset.p); break;
    case 'tab': ui(S.current).tab=t.dataset.v; renderLeft(); break;
    case 'src': goSrc(t.dataset.src); break;
    case 'art-tab': ui(S.current).art=t.dataset.v; renderArt(); break;
    case 'art-close': ui(S.current).layout='2A'; $('#review').classList.remove('l2b'); break;
    case 'award': { const a=BY[S.current];
      if(S.awarded[a.id]){ delete S.awarded[a.id]; log(`Withdrew recommendation for ${a.name}`); toast('Recommendation withdrawn'); }
      else { S.awarded[a.id]=a.ask; log(`Recommended ${fmt(a.ask)} for ${a.name}`); toast(`Recommended ${fmt(a.ask)} · pool now ${fmt(poolRemaining())}`); }
      renderTop(); renderLeft(); break; }
  }
});
document.addEventListener('input', e=>{
  if(e.target.id==='q'){ S.q=e.target.value; S.menu = S.q.trim() ? 'search' : null; renderMenu(); }
  if(e.target.id==='apps-q'){ S.aq=e.target.value; const b=$('#apps-body'); if(b) b.innerHTML=appRows(); }
});
document.addEventListener('focusin', e=>{ if(e.target.id==='q' && S.q.trim()){ S.menu='search'; renderMenu(); } });
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && S.menu){ S.menu=null; renderMenu(); }
  if(e.key==='Enter' && e.target.id==='q'){ const first=document.querySelector('.menu [data-act="open"]'); if(first){ S.q=''; first.click(); } }
  if(e.key==='Escape' && S.pop){ S.pop=null; const p=$('#mpop'); if(p) p.innerHTML=''; }
  if((e.key==='Enter'||e.key===' ') && e.target.matches && e.target.matches('g[data-act], tr[data-act]')){ e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click',{bubbles:true})); }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='login-form'){ const em=$('#email'); startSession(em && em.value.trim() ? em.value.trim() : null); }
  if(e.target.id==='composer'){ const i=$('#composer-in'); const v=i.value; i.value=''; send(v); }
});
document.addEventListener('change', e=>{
  if(e.target.id==='switcher') openBiz(e.target.value,'switch');
  if(e.target.id==='agent-select'){ S.agentApp = e.target.value; toast(`Active agent: ${e.target.options[e.target.selectedIndex].text}`); }
});
window.addEventListener('resize', ()=>{ if(S.pop) showPop(S.pop); if(S.menu) renderMenu(); });

render();
})();
</script>

</body></html>
